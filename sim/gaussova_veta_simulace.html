
<style>
  @keyframes pulse { 0%,100%{opacity:.7} 50%{opacity:1} }
  .field-line { animation: pulse 2s ease-in-out infinite; }
  select, input[type=range] { font-size: 13px; }
  .info-box { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin: 12px 0 0; }
  .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; font-size: 13px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .stat:last-child { border-bottom: none; }
  .stat-label { color: var(--color-text-secondary); }
  .stat-value { font-weight: 500; color: var(--color-text-primary); }
  .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; font-size: 13px; color: var(--color-text-secondary); }
  .control-group { display: flex; align-items: center; gap: 8px; }
</style>

<h2 class="sr-only">Interaktivní simulace Gaussovy věty elektrostatiky — vizualizace elektrického pole a toku přes uzavřenou plochu</h2>

<div class="controls">
  <div class="control-group">
    <label>Geometrie:</label>
    <select id="geo-select" onchange="updateSim()">
      <option value="point">Bodový náboj</option>
      <option value="plane">Nabitá rovina</option>
      <option value="cylinder">Nabitý válec</option>
    </select>
  </div>
  <div class="control-group">
    <label>Náboj Q:</label>
    <input type="range" id="charge-slider" min="-3" max="3" step="1" value="1" oninput="updateSim()">
    <span id="charge-val" style="min-width:28px;text-align:right;font-weight:500">+1</span>
  </div>
  <div class="control-group">
    <label>Vzdálenost r:</label>
    <input type="range" id="radius-slider" min="1" max="4" step="0.5" value="2" oninput="updateSim()">
    <span id="radius-val" style="min-width:28px;text-align:right;font-weight:500">2</span>
  </div>
</div>

<svg id="main-svg" width="100%" viewBox="0 0 680 380">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g id="scene"></g>
</svg>

<div class="info-box">
  <div class="stat"><span class="stat-label">Gaussova věta</span><span class="stat-value" id="formula-display">∯ E·dS = Q/ε₀</span></div>
  <div class="stat"><span class="stat-label">Plocha Gaussovy plochy S</span><span class="stat-value" id="area-display">—</span></div>
  <div class="stat"><span class="stat-label">Intenzita pole E</span><span class="stat-value" id="field-display">—</span></div>
  <div class="stat"><span class="stat-label">Tok Φ = E · S</span><span class="stat-value" id="flux-display">—</span></div>
  <div class="stat"><span class="stat-label">Klíčová myšlenka</span><span class="stat-value" id="insight-display">—</span></div>
</div>

<script>
const cx = 340, cy = 190;
const EPS0 = 8.85e-12;

function updateSim() {
  const geo = document.getElementById('geo-select').value;
  const Q = parseInt(document.getElementById('charge-slider').value);
  const r = parseFloat(document.getElementById('radius-slider').value);

  document.getElementById('charge-val').textContent = Q > 0 ? '+'+Q : Q;
  document.getElementById('radius-val').textContent = r;

  const scene = document.getElementById('scene');
  scene.innerHTML = '';

  if (geo === 'point') drawPoint(Q, r, scene);
  else if (geo === 'plane') drawPlane(Q, r, scene);
  else drawCylinder(Q, r, scene);
}

function fieldColor(Q) {
  return Q > 0 ? '#D85A30' : Q < 0 ? '#378ADD' : '#888780';
}
function fieldArrow(Q) {
  return Q > 0 ? 'url(#arr-red)' : Q < 0 ? 'url(#arr-blue)' : 'url(#arr)';
}

function drawPoint(Q, r, scene) {
  const scale = 55;
  const svgR = r * scale;

  // Gaussova plocha — kružnice
  const gauss = document.createElementNS('http://www.w3.org/2000/svg','circle');
  gauss.setAttribute('cx', cx); gauss.setAttribute('cy', cy);
  gauss.setAttribute('r', svgR);
  gauss.setAttribute('fill', 'none');
  gauss.setAttribute('stroke', '#1D9E75');
  gauss.setAttribute('stroke-width', '1.5');
  gauss.setAttribute('stroke-dasharray', '6 3');
  scene.appendChild(gauss);

  // Siločáry — paprsky z náboje
  const numLines = 12;
  const col = fieldColor(Q);
  const mk = fieldArrow(Q);
  if (Q !== 0) {
    for (let i = 0; i < numLines; i++) {
      const angle = (i / numLines) * 2 * Math.PI;
      const x1 = cx + Math.cos(angle) * 18;
      const y1 = cy + Math.sin(angle) * 18;
      const x2 = cx + Math.cos(angle) * (svgR - 12);
      const y2 = cy + Math.sin(angle) * (svgR - 12);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', Q > 0 ? x1 : x2);
      line.setAttribute('y1', Q > 0 ? y1 : y2);
      line.setAttribute('x2', Q > 0 ? x2 : x1);
      line.setAttribute('y2', Q > 0 ? y2 : y1);
      line.setAttribute('stroke', col);
      line.setAttribute('stroke-width', '1.5');
      line.setAttribute('marker-end', mk);
      line.setAttribute('opacity', '0.8');
      line.classList.add('field-line');
      scene.appendChild(line);
    }
  }

  // Náboj uprostřed
  const chargeCircle = document.createElementNS('http://www.w3.org/2000/svg','circle');
  chargeCircle.setAttribute('cx', cx); chargeCircle.setAttribute('cy', cy);
  chargeCircle.setAttribute('r', '14');
  chargeCircle.setAttribute('fill', Q > 0 ? '#D85A30' : Q < 0 ? '#378ADD' : '#888780');
  chargeCircle.setAttribute('stroke', 'none');
  scene.appendChild(chargeCircle);

  const chargeLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  chargeLabel.setAttribute('x', cx); chargeLabel.setAttribute('y', cy);
  chargeLabel.setAttribute('text-anchor', 'middle');
  chargeLabel.setAttribute('dominant-baseline', 'central');
  chargeLabel.setAttribute('fill', '#fff');
  chargeLabel.setAttribute('font-size', '14');
  chargeLabel.setAttribute('font-weight', '500');
  chargeLabel.textContent = Q > 0 ? '+Q' : Q < 0 ? '−Q' : '0';
  scene.appendChild(chargeLabel);

  // Popis vzdálenosti r
  const rLine = document.createElementNS('http://www.w3.org/2000/svg','line');
  rLine.setAttribute('x1', cx); rLine.setAttribute('y1', cy);
  rLine.setAttribute('x2', cx + svgR); rLine.setAttribute('y2', cy);
  rLine.setAttribute('stroke', 'var(--color-text-secondary)');
  rLine.setAttribute('stroke-width', '0.5');
  rLine.setAttribute('stroke-dasharray', '3 3');
  scene.appendChild(rLine);

  const rLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  rLabel.setAttribute('x', cx + svgR/2); rLabel.setAttribute('y', cy - 8);
  rLabel.setAttribute('text-anchor', 'middle');
  rLabel.setAttribute('fill', 'var(--color-text-secondary)');
  rLabel.setAttribute('font-size', '12');
  rLabel.textContent = 'r = ' + r;
  scene.appendChild(rLabel);

  // Popis Gaussovy plochy
  const gLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  gLabel.setAttribute('x', cx); gLabel.setAttribute('y', cy + svgR + 18);
  gLabel.setAttribute('text-anchor', 'middle');
  gLabel.setAttribute('fill', '#0F6E56');
  gLabel.setAttribute('font-size', '12');
  gLabel.textContent = 'Gaussova plocha (koule)';
  scene.appendChild(gLabel);

  // Info panel
  const S = (4 * Math.PI * r * r).toFixed(2);
  const E = Q !== 0 ? (Math.abs(Q) / (4 * Math.PI * r * r)).toFixed(4) + ' · Q/ε₀' : '0';
  const flux = Q !== 0 ? 'Q/ε₀ (nezávisí na r!)' : '0';

  document.getElementById('formula-display').textContent = '∯ E·dS = Q/ε₀';
  document.getElementById('area-display').textContent = '4πr² = ' + S + ' m²';
  document.getElementById('field-display').textContent = 'E = Q/(4πε₀r²)';
  document.getElementById('flux-display').textContent = flux;
  document.getElementById('insight-display').textContent = 'Tok nezávisí na poloměru r — záleží jen na Q uvnitř!';
}

function drawPlane(Q, r, scene) {
  const col = fieldColor(Q);
  const mk = fieldArrow(Q);

  // Rovina
  const plane = document.createElementNS('http://www.w3.org/2000/svg','rect');
  plane.setAttribute('x', 80); plane.setAttribute('y', cy - 4);
  plane.setAttribute('width', 520); plane.setAttribute('height', 8);
  plane.setAttribute('rx', '4');
  plane.setAttribute('fill', '#888780');
  plane.setAttribute('opacity', '0.6');
  scene.appendChild(plane);

  const pLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  pLabel.setAttribute('x', 600); pLabel.setAttribute('y', cy + 20);
  pLabel.setAttribute('fill', 'var(--color-text-secondary)');
  pLabel.setAttribute('font-size', '12');
  pLabel.textContent = 'σ [C/m²]';
  scene.appendChild(pLabel);

  // Siločáry — rovnoběžné
  if (Q !== 0) {
    const xPositions = [160, 220, 280, 340, 400, 460, 520];
    const lineLen = Math.min(r * 50, 130);
    for (const x of xPositions) {
      // Nahoru
      const l1 = document.createElementNS('http://www.w3.org/2000/svg','line');
      l1.setAttribute('x1', x); l1.setAttribute('y1', Q > 0 ? cy - 10 : cy - lineLen);
      l1.setAttribute('x2', x); l1.setAttribute('y2', Q > 0 ? cy - lineLen : cy - 10);
      l1.setAttribute('stroke', col); l1.setAttribute('stroke-width', '1.5');
      l1.setAttribute('marker-end', mk); l1.setAttribute('opacity', '0.8');
      l1.classList.add('field-line');
      scene.appendChild(l1);
      // Dolů
      const l2 = document.createElementNS('http://www.w3.org/2000/svg','line');
      l2.setAttribute('x1', x); l2.setAttribute('y1', Q > 0 ? cy + 10 : cy + lineLen);
      l2.setAttribute('x2', x); l2.setAttribute('y2', Q > 0 ? cy + lineLen : cy + 10);
      l2.setAttribute('stroke', col); l2.setAttribute('stroke-width', '1.5');
      l2.setAttribute('marker-end', mk); l2.setAttribute('opacity', '0.8');
      l2.classList.add('field-line');
      scene.appendChild(l2);
    }
  }

  // Gaussova plocha — válec (pillbox)
  const pillH = Math.min(r * 50, 120);
  const pillW = 120;
  const pillX = cx - pillW/2;
  const pillTop = cy - pillH;
  const pillBot = cy + pillH;

  // Čelní plochy (přes které teče tok)
  const topRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  topRect.setAttribute('x', pillX); topRect.setAttribute('y', pillTop - 4);
  topRect.setAttribute('width', pillW); topRect.setAttribute('height', 8);
  topRect.setAttribute('rx', '4'); topRect.setAttribute('fill', '#1D9E75');
  topRect.setAttribute('opacity', '0.7');
  scene.appendChild(topRect);

  const botRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  botRect.setAttribute('x', pillX); botRect.setAttribute('y', pillBot - 4);
  botRect.setAttribute('width', pillW); botRect.setAttribute('height', 8);
  botRect.setAttribute('rx', '4'); botRect.setAttribute('fill', '#1D9E75');
  botRect.setAttribute('opacity', '0.7');
  scene.appendChild(botRect);

  // Boční stěny
  const leftLine = document.createElementNS('http://www.w3.org/2000/svg','line');
  leftLine.setAttribute('x1', pillX); leftLine.setAttribute('y1', pillTop);
  leftLine.setAttribute('x2', pillX); leftLine.setAttribute('y2', pillBot);
  leftLine.setAttribute('stroke', '#1D9E75'); leftLine.setAttribute('stroke-width', '1.5');
  leftLine.setAttribute('stroke-dasharray', '5 3');
  scene.appendChild(leftLine);

  const rightLine = document.createElementNS('http://www.w3.org/2000/svg','line');
  rightLine.setAttribute('x1', pillX + pillW); rightLine.setAttribute('y1', pillTop);
  rightLine.setAttribute('x2', pillX + pillW); rightLine.setAttribute('y2', pillBot);
  rightLine.setAttribute('stroke', '#1D9E75'); rightLine.setAttribute('stroke-width', '1.5');
  rightLine.setAttribute('stroke-dasharray', '5 3');
  scene.appendChild(rightLine);

  const gLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  gLabel.setAttribute('x', pillX + pillW + 10); gLabel.setAttribute('y', cy);
  gLabel.setAttribute('fill', '#0F6E56'); gLabel.setAttribute('font-size', '12');
  gLabel.setAttribute('dominant-baseline', 'central');
  gLabel.textContent = 'Pillbox (válec)';
  scene.appendChild(gLabel);

  document.getElementById('formula-display').textContent = '2·E·S = σ·S/ε₀';
  document.getElementById('area-display').textContent = '2·S (obě čelní plochy)';
  document.getElementById('field-display').textContent = 'E = σ/(2ε₀)';
  document.getElementById('flux-display').textContent = 'Φ = σ·S/ε₀';
  document.getElementById('insight-display').textContent = 'E je konstantní — nezávisí na vzdálenosti od roviny!';
}

function drawCylinder(Q, r, scene) {
  const col = fieldColor(Q);
  const mk = fieldArrow(Q);
  const svgR = r * 50;
  const cylH = 160;

  // Nabitý válec uprostřed
  const inner = document.createElementNS('http://www.w3.org/2000/svg','rect');
  inner.setAttribute('x', cx - 12); inner.setAttribute('y', cy - cylH/2);
  inner.setAttribute('width', 24); inner.setAttribute('height', cylH);
  inner.setAttribute('rx', '6');
  inner.setAttribute('fill', Q > 0 ? '#D85A30' : Q < 0 ? '#378ADD' : '#888780');
  inner.setAttribute('opacity', '0.8');
  scene.appendChild(inner);

  const iLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  iLabel.setAttribute('x', cx); iLabel.setAttribute('y', cy);
  iLabel.setAttribute('text-anchor', 'middle'); iLabel.setAttribute('dominant-baseline', 'central');
  iLabel.setAttribute('fill', '#fff'); iLabel.setAttribute('font-size', '11');
  iLabel.textContent = 'λ';
  scene.appendChild(iLabel);

  // Siločáry — radiálně
  if (Q !== 0) {
    const angles = [0, 45, 135, 180, 225, 315];
    for (const deg of angles) {
      const rad = deg * Math.PI / 180;
      const x1 = cx + Math.cos(rad) * 14;
      const y1 = cy + Math.sin(rad) * 14;
      const x2 = cx + Math.cos(rad) * (svgR - 12);
      const y2 = cy + Math.sin(rad) * (svgR - 12);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', Q > 0 ? x1 : x2);
      line.setAttribute('y1', Q > 0 ? y1 : y2);
      line.setAttribute('x2', Q > 0 ? x2 : x1);
      line.setAttribute('y2', Q > 0 ? y2 : y1);
      line.setAttribute('stroke', col); line.setAttribute('stroke-width', '1.5');
      line.setAttribute('marker-end', mk); line.setAttribute('opacity', '0.8');
      line.classList.add('field-line');
      scene.appendChild(line);
    }
  }

  // Gaussova plocha — koaxiální válec
  const gRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  gRect.setAttribute('x', cx - svgR); gRect.setAttribute('y', cy - cylH/2);
  gRect.setAttribute('width', svgR * 2); gRect.setAttribute('height', cylH);
  gRect.setAttribute('rx', '8'); gRect.setAttribute('fill', 'none');
  gRect.setAttribute('stroke', '#1D9E75'); gRect.setAttribute('stroke-width', '1.5');
  gRect.setAttribute('stroke-dasharray', '6 3');
  scene.appendChild(gRect);

  // Vzdálenost r
  const rLine = document.createElementNS('http://www.w3.org/2000/svg','line');
  rLine.setAttribute('x1', cx); rLine.setAttribute('y1', cy);
  rLine.setAttribute('x2', cx + svgR); rLine.setAttribute('y2', cy);
  rLine.setAttribute('stroke', 'var(--color-text-secondary)');
  rLine.setAttribute('stroke-width', '0.5'); rLine.setAttribute('stroke-dasharray', '3 3');
  scene.appendChild(rLine);

  const rLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  rLabel.setAttribute('x', cx + svgR/2); rLabel.setAttribute('y', cy - 8);
  rLabel.setAttribute('text-anchor', 'middle');
  rLabel.setAttribute('fill', 'var(--color-text-secondary)'); rLabel.setAttribute('font-size', '12');
  rLabel.textContent = 'r = ' + r;
  scene.appendChild(rLabel);

  const gLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  gLabel.setAttribute('x', cx); gLabel.setAttribute('y', cy + cylH/2 + 18);
  gLabel.setAttribute('text-anchor', 'middle');
  gLabel.setAttribute('fill', '#0F6E56'); gLabel.setAttribute('font-size', '12');
  gLabel.textContent = 'Gaussova plocha (koaxiální válec)';
  scene.appendChild(gLabel);

  document.getElementById('formula-display').textContent = 'E·2πrl = λl/ε₀';
  document.getElementById('area-display').textContent = '2πrl (plášť válce)';
  document.getElementById('field-display').textContent = 'E = λ/(2πε₀r)';
  document.getElementById('flux-display').textContent = 'Φ = λl/ε₀';
  document.getElementById('insight-display').textContent = 'E klesá jako 1/r — pomaleji než u bodového náboje (1/r²)';
}

updateSim();
</script>
