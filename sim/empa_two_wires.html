<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Síla mezi dvěma vodiči — EMPA</title>
<link rel="stylesheet" href="sim-kit.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
</head>
<body class="sk">
  <div class="sk-head"><h1>Síla mezi dvěma rovnoběžnými vodiči</h1><div class="sk-formula" id="formula"></div></div>
  <div class="sk-stage"><canvas id="c"></canvas><div class="sk-readout" id="ro"></div></div>
  <div class="sk-controls" id="ctrl"></div>
  <script src="sim-kit.js"></script>
  <script>(function () {
    SK.katex(document.getElementById('formula'),
      '\\dfrac{F}{l}=\\dfrac{\\mu_0 I_1 I_2}{2\\pi d}', false);

    const ro = document.getElementById('ro');
    const canvas = document.getElementById('c');
    const mu0 = 4 * Math.PI * 1e-7;

    let I1 = 10, I2 = 10;   // A
    let dMM = 30;           // separation in mm
    let same = true;        // current directions
    const PX_PER_M = 1000;

    const view = SK.mount(canvas, draw);

    function draw(ctx, w, h) {
      const t = SK.theme();
      ctx.clearRect(0, 0, w, h);
      SK.grid(ctx, w, h, 30);
      const cy = h * 0.5;
      const dpx = SK.clamp(dMM / 1000 * PX_PER_M, 40, w * 0.6);
      const x1 = w / 2 - dpx / 2, x2 = w / 2 + dpx / 2;
      // wire 1 always ⊙ (out). wire 2 ⊙ if same else ⊗
      const w1Out = true, w2Out = same;

      // B field of each wire (concentric circles)
      drawBcircles(ctx, x1, cy, w1Out, w, h, t, 0.30);
      drawBcircles(ctx, x2, cy, w2Out, w, h, t, 0.30);

      // wire symbols
      drawWire(ctx, x1, cy, w1Out, 'I₁', t);
      drawWire(ctx, x2, cy, w2Out, 'I₂', t);

      // separation marker
      ctx.save(); ctx.strokeStyle = t.axis; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x1, cy + 40); ctx.lineTo(x2, cy + 40); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
      SK.label(ctx, 'd', (x1 + x2) / 2, cy + 56, { color: t.muted, align: 'center' });

      // Force direction: same currents attract, opposite repel
      const attract = same;
      const FperL = mu0 * I1 * I2 / (2 * Math.PI * (dMM / 1000));
      const Fdir = attract ? 1 : -1; // 1 = toward each other
      const aLen = SK.clamp(FperL * 1e4, 14, 50);
      // wire1 force
      SK.arrow(ctx, x1, cy - 24, x1 + Fdir * aLen, cy - 24, { color: t.ok, width: 2.6, head: 8 });
      SK.arrow(ctx, x2, cy - 24, x2 - Fdir * aLen, cy - 24, { color: t.ok, width: 2.6, head: 8 });
      SK.label(ctx, 'F', x1 + Fdir * aLen / 2, cy - 32, { color: t.ok, font: 'bold 13px system-ui', align: 'center' });
      SK.label(ctx, 'F', x2 - Fdir * aLen / 2, cy - 32, { color: t.ok, font: 'bold 13px system-ui', align: 'center' });

      ro.innerHTML = `<b>I₁ = ${SK.fmt(I1, 1)} A</b>, <b>I₂ = ${SK.fmt(I2, 1)} A</b><br>` +
                     `Vzdálenost d = <b>${dMM} mm</b><br>` +
                     `F/l = µ₀I₁I₂/(2πd) = <b>${(FperL * 1e6).toFixed(2)} µN/m</b><br>` +
                     `Směr: <b>${attract ? 'přitahují se' : 'odpuzují se'}</b> (${same ? 'souhlasné' : 'nesouhlasné'} proudy)`;
    }

    function drawWire(ctx, x, y, out, lbl, t) {
      SK.dot(ctx, x, y, 12, t.fg);
      ctx.save(); ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 2;
      if (out) { ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); }
      else {
        ctx.beginPath();
        ctx.moveTo(x - 7, y - 7); ctx.lineTo(x + 7, y + 7);
        ctx.moveTo(x + 7, y - 7); ctx.lineTo(x - 7, y + 7); ctx.stroke();
      }
      ctx.restore();
      SK.label(ctx, lbl + (out ? ' ⊙' : ' ⊗'), x, y - 20, { color: t.fg, font: 'bold 12px system-ui', align: 'center' });
    }

    function drawBcircles(ctx, cx, cy, out, w, h, t, alpha) {
      ctx.save();
      const dir = out ? -1 : 1; // out of page → B counterclockwise as seen
      for (let k = 1; k <= 5; k++) {
        const r = 22 * k;
        ctx.strokeStyle = t.mag; ctx.globalAlpha = alpha * (1 - k * 0.12); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
        // a couple of direction arrows
        const ang = 0.6 + k * 0.3;
        const px = cx + r * Math.cos(ang), py = cy + r * Math.sin(ang);
        const tx = -Math.sin(ang) * dir, ty = Math.cos(ang) * dir;
        ctx.globalAlpha = 0.7;
        SK.arrow(ctx, px - tx * 5, py - ty * 5, px + tx * 5, py + ty * 5, { color: t.mag, width: 1.3, head: 4 });
      }
      ctx.restore();
    }

    SK.controls(document.getElementById('ctrl'), [
      SK.tabs({ options: [
        { label: 'Souhlasné', value: 'same' },
        { label: 'Nesouhlasné', value: 'opp' },
      ], value: 'same', onchange: (v) => { same = (v === 'same'); view.redraw(); } }),
      SK.slider({ label: 'Proud I₁', min: 1, max: 30, step: 1, value: 10, unit: 'A',
                  fmt: (v) => v | 0, oninput: (v) => { I1 = v; view.redraw(); } }),
      SK.slider({ label: 'Proud I₂', min: 1, max: 30, step: 1, value: 10, unit: 'A',
                  fmt: (v) => v | 0, oninput: (v) => { I2 = v; view.redraw(); } }),
      SK.slider({ label: 'Vzdálenost d', min: 10, max: 80, step: 1, value: 30, unit: 'mm',
                  fmt: (v) => v | 0, oninput: (v) => { dMM = v; view.redraw(); } }),
    ]);
    const hint = document.createElement('div');
    hint.className = 'sk-hint';
    hint.textContent = 'Každý vodič je v poli toho druhého a působí na něj síla F = BIl. Souhlasné proudy se přitahují, nesouhlasné odpuzují. Síla klesá s rostoucí vzdáleností (1/d).';
    document.getElementById('ctrl').appendChild(hint);
  })();</script>
</body>
</html>
