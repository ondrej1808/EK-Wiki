<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numerické metody — DRN</title>
<link rel="stylesheet" href="sim-kit.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
</head>
<body class="sk">
  <div class="sk-head"><h1>Numerické metody — rovnice, integrál, ODR</h1><div class="sk-formula" id="formula"></div></div>
  <div class="sk-stage"><canvas id="c"></canvas><div class="sk-readout" id="ro"></div></div>
  <div class="sk-controls" id="ctrl"></div>
  <script src="sim-kit.js"></script>
  <script>(function () {
    const fEl = document.getElementById('formula'), ro = document.getElementById('ro');
    let tab = 'integ', nInt = 6, hExp = 6, iters = 4, imethod = 'mid';
    function setF() { SK.katex(fEl, tab === 'root' ? "f(x)=0:\\ \\text{bisekce} \\;|\\; \\text{Newton } x_{k+1}=x_k-\\tfrac{f(x_k)}{f'(x_k)}"
      : tab === 'integ' ? "\\int_a^b f\\,dx \\approx \\text{obdélník} / \\text{lichoběžník} / \\text{Simpson}"
      : "y'=f(x,y):\\ \\text{Euler} / \\text{Heun (RK2)} / \\text{RK4}", false); }
    setF();

    const view = SK.mount(document.getElementById('c'), draw);
    function frame(ctx, w, h, xmin, xmax, ymin, ymax, t) { const pad = { l: 44, r: 14, t: 16, b: 28 };
      const X = (x) => pad.l + (x - xmin) / (xmax - xmin) * (w - pad.l - pad.r), Y = (y) => h - pad.b - (y - ymin) / (ymax - ymin) * (h - pad.t - pad.b);
      ctx.save(); ctx.strokeStyle = t.axis; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(X(xmin), Y(0)); ctx.lineTo(X(xmax), Y(0)); ctx.moveTo(X(0 > xmin ? 0 : xmin), Y(ymin)); ctx.lineTo(X(0 > xmin ? 0 : xmin), Y(ymax)); ctx.stroke(); ctx.restore(); return { X, Y }; }

    function draw(ctx, w, h) { const t = SK.theme(); ctx.clearRect(0, 0, w, h); SK.grid(ctx, w, h, 28); tab === 'root' ? drawRoot(ctx, w, h, t) : tab === 'integ' ? drawInteg(ctx, w, h, t) : drawODE(ctx, w, h, t); }

    function drawInteg(ctx, w, h, t) {
      const f = (x) => Math.sin(x) + 1.2, a = 0, b = Math.PI * 1.5;
      const { X, Y } = frame(ctx, w, h, a - 0.2, b + 0.2, 0, 2.6, t);
      ctx.save(); ctx.strokeStyle = t.accent2; ctx.lineWidth = 2.4; ctx.beginPath(); for (let i = 0; i <= 200; i++) { const x = a + (b - a) * i / 200, p = [X(x), Y(f(x))]; i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); } ctx.stroke(); ctx.restore();
      const dx = (b - a) / nInt; let sum = 0;
      ctx.save(); ctx.fillStyle = t.accent; ctx.globalAlpha = 0.18; ctx.strokeStyle = t.accent; ctx.lineWidth = 1;
      for (let i = 0; i < nInt; i++) { const xl = a + i * dx, xr = xl + dx;
        if (imethod === 'mid') { const xm = (xl + xr) / 2, yv = f(xm); sum += yv * dx; ctx.fillRect(X(xl), Y(yv), X(xr) - X(xl), Y(0) - Y(yv)); ctx.strokeRect(X(xl), Y(yv), X(xr) - X(xl), Y(0) - Y(yv)); }
        else if (imethod === 'trap') { sum += (f(xl) + f(xr)) / 2 * dx; ctx.beginPath(); ctx.moveTo(X(xl), Y(0)); ctx.lineTo(X(xl), Y(f(xl))); ctx.lineTo(X(xr), Y(f(xr))); ctx.lineTo(X(xr), Y(0)); ctx.closePath(); ctx.fill(); ctx.stroke(); } }
      if (imethod === 'simp') { const m = nInt % 2 ? nInt + 1 : nInt, ddx = (b - a) / m; sum = f(a) + f(b); for (let i = 1; i < m; i++) sum += (i % 2 ? 4 : 2) * f(a + i * ddx); sum *= ddx / 3;
        ctx.fillStyle = t.accent; ctx.globalAlpha = 0.12; ctx.beginPath(); ctx.moveTo(X(a), Y(0)); for (let i = 0; i <= 200; i++) { const x = a + (b - a) * i / 200; ctx.lineTo(X(x), Y(f(x))); } ctx.lineTo(X(b), Y(0)); ctx.closePath(); ctx.fill(); }
      ctx.restore();
      let exact = 0; const N = 5000, hx = (b - a) / N; for (let i = 0; i < N; i++) exact += f(a + (i + 0.5) * hx) * hx;
      ro.innerHTML = `<b>Numerický integrál</b> · ${imethod === 'mid' ? 'obdélníková (střední)' : imethod === 'trap' ? 'lichoběžníková' : 'Simpsonova'} · n=${nInt}<br>` +
        `přibližně = <b>${SK.fmt(sum, 4)}</b> · přesně = ${SK.fmt(exact, 4)} · chyba = <b>${SK.fmt(Math.abs(sum - exact), 5)}</b><br>` +
        `Simpson (parabolická) konverguje řádově rychleji (chyba ~h⁴) než lichoběžník (~h²) a obdélník.`;
    }

    function drawODE(ctx, w, h, t) {
      const f = (x, y) => x - y, exact = (x) => x - 1 + 2 * Math.exp(-x), a = 0, b = 5, hh = b / Math.round(hExp);
      const { X, Y } = frame(ctx, w, h, a, b, 0, 4.2, t);
      ctx.save(); ctx.strokeStyle = t.muted; ctx.lineWidth = 2.4; ctx.setLineDash([5, 4]); ctx.beginPath(); for (let i = 0; i <= 200; i++) { const x = a + (b - a) * i / 200; const p = [X(x), Y(exact(x))]; i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); } ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      function run(step) { const pts = [[a, 1]]; let x = a, y = 1; while (x < b - 1e-9) { const dh = Math.min(hh, b - x);
        if (step === 'euler') y += dh * f(x, y);
        else if (step === 'heun') { const k1 = f(x, y), k2 = f(x + dh, y + dh * k1); y += dh / 2 * (k1 + k2); }
        else { const k1 = f(x, y), k2 = f(x + dh / 2, y + dh / 2 * k1), k3 = f(x + dh / 2, y + dh / 2 * k2), k4 = f(x + dh, y + dh * k3); y += dh / 6 * (k1 + 2 * k2 + 2 * k3 + k4); }
        x += dh; pts.push([x, y]); } return pts; }
      const cols = { euler: t.pos, heun: t.warn, rk4: t.ok }, names = { euler: 'Euler', heun: 'Heun (RK2)', rk4: 'RK4' };
      let txt = ''; let yl = 16;
      for (const m of ['euler', 'heun', 'rk4']) { const pts = run(m); ctx.save(); ctx.strokeStyle = cols[m]; ctx.lineWidth = 2; ctx.beginPath(); pts.forEach((p, i) => { const q = [X(p[0]), Y(SK.clamp(p[1], 0, 4.2))]; i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.stroke();
        pts.forEach(p => SK.dot(ctx, X(p[0]), Y(SK.clamp(p[1], 0, 4.2)), 2, cols[m])); ctx.restore();
        const err = Math.abs(pts[pts.length - 1][1] - exact(b)); txt += `${names[m]}: chyba=${SK.fmt(err, 4)} `; SK.label(ctx, names[m], X(b) - 4, Y(exact(b)) + yl, { color: cols[m], align: 'right', font: '10px system-ui' }); yl += 14; }
      ro.innerHTML = `<b>ODR y'=x−y, y(0)=1</b> · krok h=${SK.fmt(hh, 2)} (${Math.round(hExp)} kroků)<br>` +
        `Šedě přesné řešení. Koncové chyby — ${txt}<br>Euler (řád 1) je nejhrubší, Heun (řád 2) lepší, RK4 (řád 4) téměř přesný.`;
    }

    function drawRoot(ctx, w, h, t) {
      const f = (x) => x * x - 2, df = (x) => 2 * x, root = Math.SQRT2;
      const { X, Y } = frame(ctx, w, h, 0, 2.4, -2.5, 4, t);
      ctx.save(); ctx.strokeStyle = t.accent2; ctx.lineWidth = 2.4; ctx.beginPath(); for (let i = 0; i <= 200; i++) { const x = 2.4 * i / 200; const p = [X(x), Y(f(x))]; i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); } ctx.stroke(); ctx.restore();
      SK.dot(ctx, X(root), Y(0), 4, t.muted); SK.label(ctx, '√2', X(root), Y(0) + 14, { color: t.muted, align: 'center', font: '10px system-ui' });
      // bisection
      let lo = 1, hi = 2; for (let k = 0; k < iters; k++) { const mid = (lo + hi) / 2; if (f(lo) * f(mid) <= 0) hi = mid; else lo = mid; }
      const bis = (lo + hi) / 2;
      ctx.save(); ctx.strokeStyle = t.pos; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(lo), Y(0)); ctx.lineTo(X(hi), Y(0)); ctx.stroke();
      SK.dot(ctx, X(lo), Y(0), 4, t.pos); SK.dot(ctx, X(hi), Y(0), 4, t.pos); SK.dot(ctx, X(bis), Y(0), 5, t.pos); ctx.restore();
      // Newton
      let xn = 2; const path = [xn]; for (let k = 0; k < iters; k++) { xn = xn - f(xn) / df(xn); path.push(xn); }
      ctx.save(); ctx.strokeStyle = t.ok; ctx.lineWidth = 1.6;
      let xc = 2; for (let k = 0; k < iters; k++) { const yc = f(xc); const xnext = xc - yc / df(xc); ctx.beginPath(); ctx.moveTo(X(xc), Y(yc)); ctx.lineTo(X(xnext), Y(0)); ctx.stroke(); ctx.beginPath(); ctx.moveTo(X(xc), Y(0)); ctx.lineTo(X(xc), Y(yc)); ctx.stroke(); SK.dot(ctx, X(xnext), Y(0), 4, t.ok); xc = xnext; }
      ctx.restore();
      ro.innerHTML = `<b>Hledání kořene f(x)=x²−2=0</b> (√2=${SK.fmt(root, 5)}) · ${iters} iterací<br>` +
        `<span style="color:#dc2626">Bisekce</span>: x≈${SK.fmt(bis, 5)} (chyba ${SK.fmt(Math.abs(bis - root), 6)}) — spolehlivá, lineární konvergence (interval se půlí).<br>` +
        `<span style="color:#16a34a">Newton</span>: x≈${SK.fmt(xn, 6)} (chyba ${SK.fmt(Math.abs(xn - root), 8)}) — kvadratická konvergence (počet platných cifer se zdvojnásobuje).`;
    }

    const ctrl = document.getElementById('ctrl');
    ctrl.appendChild(SK.tabs({ options: [{ label: 'Kořen rovnice', value: 'root' }, { label: 'Integrál', value: 'integ' }, { label: 'ODR', value: 'ode' }], value: 'integ', onchange: (v) => { tab = v; setF(); rebuild(); view.redraw(); } }).el);
    const holder = document.createElement('div'); ctrl.appendChild(holder);
    function rebuild() {
      holder.innerHTML = '';
      if (tab === 'integ') { holder.appendChild(SK.tabs({ options: [{ label: 'obdélník', value: 'mid' }, { label: 'lichoběžník', value: 'trap' }, { label: 'Simpson', value: 'simp' }], value: imethod, onchange: (v) => { imethod = v; view.redraw(); } }).el);
        SK.controls(holder, [SK.slider({ label: 'Počet dílků n', min: 2, max: 40, step: 1, value: nInt, unit: '', fmt: (v) => v | 0, oninput: (v) => { nInt = v | 0; view.redraw(); } })]); }
      else if (tab === 'ode') SK.controls(holder, [SK.slider({ label: 'Počet kroků', min: 3, max: 40, step: 1, value: hExp, unit: '', fmt: (v) => v | 0, oninput: (v) => { hExp = v | 0; view.redraw(); } })]);
      else SK.controls(holder, [SK.slider({ label: 'Počet iterací', min: 0, max: 10, step: 1, value: iters, unit: '', fmt: (v) => v | 0, oninput: (v) => { iters = v | 0; view.redraw(); } })]);
    }
    rebuild();
    const hint = document.createElement('div'); hint.className = 'sk-hint';
    hint.textContent = 'Tři základní úlohy numeriky. Kořen rovnice: bisekce spolehlivě půlí interval (lineární konvergence), ' +
      'Newtonova metoda používá tečnu a konverguje kvadraticky (rychle, ale potřebuje dobrý odhad). Numerický integrál: ' +
      'obdélníková a lichoběžníková metoda mají chybu ~h², Simpsonova (parabolická) ~h⁴. Řešení ODR: Eulerova metoda je ' +
      'řádu 1 (hrubá), Heunova/RK2 řádu 2, RK4 řádu 4 (velmi přesná). Měň počet dílků/kroků/iterací a sleduj pokles chyby.';
    ctrl.appendChild(hint);
  })();</script>
</body>
</html>
