<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Směrové pole & Eulerova metoda — DRN</title>
<link rel="stylesheet" href="sim-kit.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
</head>
<body class="sk">
  <div class="sk-head"><h1>Směrové pole &amp; Eulerova metoda</h1><div class="sk-formula" id="formula"></div></div>
  <div class="sk-stage"><canvas id="c"></canvas><div class="sk-readout" id="ro"></div></div>
  <div class="sk-controls" id="ctrl"></div>
  <script src="sim-kit.js"></script>
  <script>(function () {
    const fEl = document.getElementById('formula');
    const ro = document.getElementById('ro');
    const canvas = document.getElementById('c');

    const EQ = {
      'y':   { f: (x, y) => y,           tex: "y'=y" },
      '-y':  { f: (x, y) => -y,          tex: "y'=-y" },
      'x-y': { f: (x, y) => x - y,       tex: "y'=x-y" },
      'xy':  { f: (x, y) => 0.5 * x * y, tex: "y'=\\tfrac12 xy" },
      'sin': { f: (x, y) => Math.cos(x) - 0.3 * y, tex: "y'=\\cos x-0{,}3y" },
    };
    let ek = 'x-y';
    let x0 = -3, y0 = 1, hstep = 0.5;
    let dragging = false;
    const XMIN = -4, XMAX = 4, YMIN = -3, YMAX = 3;
    const F = (x, y) => EQ[ek].f(x, y);

    function setFormula() { SK.katex(fEl, EQ[ek].tex + ",\\quad y_{n+1}=y_n+h\\,f(x_n,y_n)", false); }
    setFormula();

    const map = (w, h) => { const pad = 28;
      const X = (x) => pad + (x - XMIN) / (XMAX - XMIN) * (w - 2 * pad);
      const Y = (y) => h - pad - (y - YMIN) / (YMAX - YMIN) * (h - 2 * pad);
      return { X, Y }; };
    const view = SK.mount(canvas, draw);

    function draw(ctx, w, h) {
      const t = SK.theme();
      ctx.clearRect(0, 0, w, h);
      const { X, Y } = map(w, h);
      // axes
      ctx.save(); ctx.strokeStyle = t.axis; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(X(XMIN), Y(0)); ctx.lineTo(X(XMAX), Y(0)); ctx.moveTo(X(0), Y(YMIN)); ctx.lineTo(X(0), Y(YMAX)); ctx.stroke(); ctx.restore();

      // slope field
      ctx.save(); ctx.strokeStyle = t.muted; ctx.lineWidth = 1.3; const L = 11;
      for (let gx = XMIN; gx <= XMAX + 1e-9; gx += 0.5)
        for (let gy = YMIN; gy <= YMAX + 1e-9; gy += 0.4) {
          const s = F(gx, gy), ang = Math.atan(s), dx = Math.cos(ang) * L, dy = Math.sin(ang) * L;
          const cx = X(gx), cy = Y(gy);
          ctx.beginPath(); ctx.moveTo(cx - dx, cy + dy); ctx.lineTo(cx + dx, cy - dy); ctx.stroke();
        }
      ctx.restore();

      // RK4 reference (fine) from (x0,y0) both directions
      drawSolution(ctx, X, Y, t.ok, rk4Curve(0.02), 2.4, null);
      // Euler polygon with step h
      const eu = eulerCurve(hstep);
      drawSolution(ctx, X, Y, t.accent, eu.pts, 2, [1, 0]);
      // Euler nodes
      ctx.save(); eu.nodes.forEach(p => SK.dot(ctx, X(p[0]), Y(p[1]), 3, t.accent)); ctx.restore();
      // initial point
      SK.dot(ctx, X(x0), Y(y0), 6, t.pos);
      SK.label(ctx, '(x₀,y₀)', X(x0) + 8, Y(y0) - 8, { color: t.pos, font: '11px system-ui' });

      SK.label(ctx, 'RK4 (přesné)', w - 16, 18, { color: t.ok, align: 'right', font: '12px system-ui' });
      SK.label(ctx, 'Euler (h=' + SK.fmt(hstep, 2) + ')', w - 16, 34, { color: t.accent, align: 'right', font: '12px system-ui' });

      // error at right end
      const eEnd = eu.nodes[eu.nodes.length - 1], ref = rk4At(eEnd ? eEnd[0] : XMAX);
      ro.innerHTML = `<b>${EQ[ek].tex.replace(/\\tfrac12/, '½').replace(/[{}]/g, '')}</b> · (x₀,y₀)=(${SK.fmt(x0, 1)}, ${SK.fmt(y0, 1)})<br>` +
        `Eulerův krok h=${SK.fmt(hstep, 2)} · ${eu.nodes.length - 1} kroků<br>` +
        (eEnd ? `v x=${SK.fmt(eEnd[0], 1)}: Euler y=${SK.fmt(eEnd[1], 3)}, přesně≈${SK.fmt(ref, 3)}, chyba ${SK.fmt(Math.abs(eEnd[1] - ref), 3)}<br>` : '') +
        `Táhni počáteční bod. Menší h → Euler se blíží přesnému řešení.`;
    }

    function eulerCurve(h) {
      const pts = [], nodes = [];
      for (const dir of [1, -1]) {
        let x = x0, y = y0; const seq = [[x, y]];
        for (let i = 0; i < 400; i++) { y = y + dir * h * F(x, y); x = x + dir * h;
          if (x < XMIN - 0.5 || x > XMAX + 0.5 || y < YMIN - 2 || y > YMAX + 2) break; seq.push([x, y]); }
        if (dir === 1) { seq.forEach(p => nodes.push(p)); pts.push(...seq); }
        else { pts.unshift(...seq.reverse()); }
      }
      return { pts, nodes };
    }
    function rk4Curve(h) {
      const pts = [];
      for (const dir of [1, -1]) {
        let x = x0, y = y0; const seq = [[x, y]];
        for (let i = 0; i < 4000; i++) { const k1 = F(x, y), k2 = F(x + dir * h / 2, y + dir * h / 2 * k1),
          k3 = F(x + dir * h / 2, y + dir * h / 2 * k2), k4 = F(x + dir * h, y + dir * h * k3);
          y += dir * h / 6 * (k1 + 2 * k2 + 2 * k3 + k4); x += dir * h;
          if (x < XMIN - 0.5 || x > XMAX + 0.5 || y < YMIN - 3 || y > YMAX + 3) break; seq.push([x, y]); }
        if (dir === 1) pts.push(...seq); else pts.unshift(...seq.reverse());
      }
      return pts;
    }
    function rk4At(xt) { const h = 0.02 * Math.sign(xt - x0 || 1); let x = x0, y = y0, n = Math.abs(Math.round((xt - x0) / h));
      for (let i = 0; i < n; i++) { const k1 = F(x, y), k2 = F(x + h / 2, y + h / 2 * k1), k3 = F(x + h / 2, y + h / 2 * k2), k4 = F(x + h, y + h * k3);
        y += h / 6 * (k1 + 2 * k2 + 2 * k3 + k4); x += h; } return y; }

    function drawSolution(ctx, X, Y, color, pts, width, dash) {
      if (!pts.length) return;
      ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width; if (dash) ctx.setLineDash([5, 4]);
      ctx.beginPath(); let started = false;
      pts.forEach(p => { const px = X(p[0]), py = Y(p[1]); if (py < -50 || py > 5000) { started = false; return; }
        started ? ctx.lineTo(px, py) : (ctx.moveTo(px, py), started = true); });
      ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    }

    canvas.addEventListener('pointerdown', (e) => { dragging = true; canvas.setPointerCapture(e.pointerId); setIC(e); });
    canvas.addEventListener('pointermove', (e) => { if (dragging) setIC(e); });
    canvas.addEventListener('pointerup', () => dragging = false);
    canvas.addEventListener('pointercancel', () => dragging = false);
    function setIC(e) { const { w, h } = view.dims(); const { X, Y } = map(w, h); const p = SK.pointer(canvas, e);
      x0 = SK.clamp(XMIN + (p.x - X(XMIN)) / (X(XMAX) - X(XMIN)) * (XMAX - XMIN), XMIN, XMAX);
      y0 = SK.clamp(YMIN + (Y(YMIN) - p.y) / (Y(YMIN) - Y(YMAX)) * (YMAX - YMIN), YMIN, YMAX); view.redraw(); }

    const ctrl = document.getElementById('ctrl');
    ctrl.appendChild(SK.tabs({ options: Object.keys(EQ).map(k => ({ label: EQ[k].tex.replace(/[\\]/g, '').replace('tfrac12', '½'), value: k })),
      value: ek, onchange: (v) => { ek = v; setFormula(); view.redraw(); } }).el);
    SK.controls(ctrl, [SK.slider({ label: 'Eulerův krok h', min: 0.1, max: 1.0, step: 0.05, value: 0.5, unit: '', fmt: (v) => SK.fmt(v, 2), oninput: (v) => { hstep = v; view.redraw(); } })]);
    const hint = document.createElement('div'); hint.className = 'sk-hint';
    hint.textContent = 'Směrové pole: v každém bodě ukazuje úsečka sklon y′=f(x,y). Řešení ODR je křivka, která je všude ' +
      'tečná k poli. Zeleně přesné řešení (RK4), oranžově Eulerova metoda yₙ₊₁=yₙ+h·f — po krocích „po tečně". ' +
      'Velký krok h → Euler se odchyluje (lokální chyba ~h²); zmenši h a chyba klesá. Táhni počáteční podmínku.';
    ctrl.appendChild(hint);
  })();</script>
</body>
</html>
