<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCD vs CMOS snímač — AVT</title>
<link rel="stylesheet" href="sim-kit.css">
</head>
<body class="sk">
  <div class="sk-head"><h1>Obrazový snímač — CCD vs CMOS</h1><div class="sk-formula" id="formula"></div></div>
  <div class="sk-stage"><canvas id="c"></canvas><div class="sk-readout" id="ro"></div></div>
  <div class="sk-controls" id="ctrl"></div>
  <script src="sim-kit.js"></script>
  <script>(function () {
    document.getElementById('formula').textContent = 'CCD: sériový přesun náboje do jednoho zesilovače · CMOS: aktivní pixel + maticová adresace';
    const ro = document.getElementById('ro');
    let mode = 'ccd', t = 0, speed = 1, playing = false;
    const N = 6, bright = [];
    for (let i = 0; i < N * N; i++) bright.push(0.25 + 0.7 * Math.random());

    const view = SK.mount(document.getElementById('c'), draw);
    const anim = SK.loop((dt) => { t += dt * speed; view.redraw(); });

    function draw(ctx, w, h) {
      const th = SK.theme(); ctx.clearRect(0, 0, w, h);
      const gx = 70, gy = 40, cell = Math.min((w - 160) / N, (h - 130) / N);
      // pixel grid
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const b = Math.round(bright[r * N + c] * 230) + 15;
        ctx.fillStyle = `rgb(${b},${b},${b})`; ctx.fillRect(gx + c * cell, gy + r * cell, cell - 2, cell - 2);
      }
      if (mode === 'ccd') drawCCD(ctx, th, gx, gy, cell, w, h); else drawCMOS(ctx, th, gx, gy, cell, w, h);
    }

    function drawCCD(ctx, th, gx, gy, cell, w, h) {
      const regY = gy + N * cell + 6;
      // serial (horizontal) readout register + amplifier (bottom-left)
      ctx.save(); ctx.strokeStyle = th.mag; ctx.lineWidth = 2; ctx.strokeRect(gx, regY, N * cell - 2, cell * 0.7); ctx.restore();
      SK.label(ctx, 'sériový registr →', gx + N * cell / 2, regY + cell * 0.9, { color: th.mag, align: 'center', font: '11px system-ui' });
      const ax = gx - 30, ay = regY + cell * 0.35;
      ctx.save(); ctx.fillStyle = th.warn; ctx.beginPath(); ctx.moveTo(ax - 16, ay - 12); ctx.lineTo(ax, ay); ctx.lineTo(ax - 16, ay + 12); ctx.closePath(); ctx.fill(); ctx.restore();
      SK.label(ctx, '1× zesilovač → A/D', ax - 8, ay - 18, { color: th.warn, font: '10px system-ui' });
      // animated charge packet: down a column, then along register to amp
      const period = N + N;             // steps for one packet
      const tot = (t * 2) % period;
      const col = Math.floor((t * 2) / period) % N;
      let pkx, pky;
      if (tot < N) { pkx = gx + (N - 1 - col) * cell + cell / 2; pky = gy + tot * cell + cell / 2; }
      else { const s = tot - N; pkx = gx + ((N - 1 - col) * cell + cell / 2) - s * cell; pky = regY + cell * 0.35; pkx = Math.max(ax, pkx); }
      ctx.save(); ctx.fillStyle = th.ok; ctx.beginPath(); ctx.arc(pkx, pky, cell * 0.22, 0, 7); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
      // vertical shift arrows
      ctx.save(); for (let c = 0; c < N; c++) SK.arrow(ctx, gx + c * cell + cell / 2, gy - 8, gx + c * cell + cell / 2, gy - 2, { color: th.muted, width: 1, head: 3 }); ctx.restore();
      ro.innerHTML = `<b>CCD</b> (Charge-Coupled Device)<br>Náboj se po sloupcích posouvá dolů do sériového registru a tím do ` +
        `<b>jednoho</b> rohového zesilovače → externí A/D.<br>+ uniformní, malý šum, global shutter, vysoký dyn. rozsah<br>` +
        `− pomalé sériové čtení, blooming, vyšší spotřeba.`;
    }

    function drawCMOS(ctx, th, gx, gy, cell, w, h) {
      const row = Math.floor(t * 3) % N;
      // active row highlight
      ctx.save(); ctx.strokeStyle = th.ok; ctx.lineWidth = 3; ctx.strokeRect(gx - 2, gy + row * cell - 2, N * cell + 2, cell); ctx.restore();
      SK.label(ctx, 'výběr řádku →', gx - 8, gy + row * cell + cell / 2, { color: th.ok, align: 'right', font: '10px system-ui', baseline: 'middle' });
      // per-pixel transistor dots
      ctx.save(); ctx.fillStyle = th.accent2; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { ctx.beginPath(); ctx.arc(gx + c * cell + cell - 6, gy + r * cell + cell - 6, 2, 0, 7); ctx.fill(); } ctx.restore();
      // column buses → ADC blocks at bottom (per column)
      const adcY = gy + N * cell + 8;
      for (let c = 0; c < N; c++) { const x = gx + c * cell + cell / 2;
        ctx.save(); ctx.strokeStyle = th.mag; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x, gy + row * cell + cell / 2); ctx.lineTo(x, adcY); ctx.stroke();
        ctx.fillStyle = th.warn; ctx.fillRect(x - cell * 0.3, adcY, cell * 0.6, 12); ctx.restore(); }
      SK.label(ctx, 'A/D na každém sloupci (paralelně)', gx + N * cell / 2, adcY + 26, { color: th.warn, align: 'center', font: '11px system-ui' });
      ro.innerHTML = `<b>CMOS</b> (Active Pixel Sensor)<br>Každý pixel má vlastní zesilovač; čte se <b>maticovou adresací</b> řádek po řádku, ` +
        `A/D paralelně po sloupcích.<br>+ rychlé, nízká spotřeba, ROI, celý procesor na čipu (SoC)<br>` +
        `− vyšší fixní šum (FPN), rolling shutter (zkreslení rychlého pohybu).`;
    }

    const ctrl = document.getElementById('ctrl');
    ctrl.appendChild(SK.tabs({ options: [{ label: 'CCD', value: 'ccd' }, { label: 'CMOS', value: 'cmos' }], value: 'ccd', onchange: (v) => { mode = v; view.redraw(); } }).el);
    SK.controls(ctrl, [
      SK.button({ label: '▶ Vyčítat', primary: true, onclick: (b) => { anim.toggle(); b.textContent = anim.running ? '⏸ Pauza' : '▶ Vyčítat'; } }),
      SK.slider({ label: 'Rychlost', min: 0.3, max: 3, step: 0.1, value: 1, unit: '×', fmt: (v) => SK.fmt(v, 1), oninput: (v) => { speed = v; } }),
    ]);
    const hint = document.createElement('div'); hint.className = 'sk-hint';
    hint.textContent = 'Oba snímače měří jen intenzitu světla (náboj z fotodiod). CCD přesouvá nábojové balíčky posuvnými ' +
      'registry do jediného zesilovače — uniformní a tichý, ale pomalý a náchylný k bloomingu. CMOS má aktivní pixel s ' +
      'vlastním zesilovačem a adresuje se jako paměť; je rychlý, úsporný a integruje celý řetězec na čip, ale má vyšší ' +
      'fixní šum a rolling shutter. Spusť „Vyčítat" a porovnej způsob čtení.';
    ctrl.appendChild(hint);
  })();</script>
</body>
</html>
