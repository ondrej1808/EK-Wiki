<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pohled skrz čočku — FY2</title>
<link rel="stylesheet" href="sim-kit.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
</head>
<body class="sk">
  <div class="sk-head"><h1>Pohled pozorovatele skrz čočku</h1><div class="sk-formula" id="formula"></div></div>
  <div class="sk-stage"><canvas id="c"></canvas><div class="sk-readout" id="ro"></div></div>
  <div class="sk-controls" id="ctrl"></div>
  <script src="sim-kit.js"></script>
  <script>(function () {
    SK.katex(document.getElementById('formula'),
      "Z=-\\dfrac{a'}{a},\\quad \\tfrac1a+\\tfrac1{a'}=\\tfrac1f", false);

    const ro = document.getElementById('ro');
    const canvas = document.getElementById('c');

    let kind = 'spojka', fAbs = 12, a = 7, yObj = 3, eyeD = 16;
    let dragging = null;            // 'obj' | 'eye' | null
    const A_MIN = 1, A_MAX = 40;

    function fSigned() { return kind === 'spojka' ? +fAbs : -fAbs; }
    function image() {
      const inv = 1 / fSigned() - 1 / a;
      if (Math.abs(inv) < 1e-4) return { inf: true };
      const aP = 1 / inv; return { aP, Z: -aP / a };
    }

    const view = SK.mount(canvas, draw);

    function eye(ctx, x, y, t, r) {
      ctx.save(); ctx.strokeStyle = t.fg; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x - r, y); ctx.quadraticCurveTo(x, y - r * 0.9, x + r, y);
      ctx.quadraticCurveTo(x, y + r * 0.9, x - r, y); ctx.stroke();
      ctx.fillStyle = t.fg; ctx.beginPath(); ctx.arc(x, y, r * 0.32, 0, 7); ctx.fill();
      ctx.restore();
    }
    function lens(ctx, xL, yA, half, t) {
      ctx.save(); ctx.strokeStyle = t.accent2; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(xL, yA - half); ctx.lineTo(xL, yA + half); ctx.stroke();
      const hd = 9;
      if (kind === 'spojka') { SK.arrow(ctx, xL, yA - half + hd + 2, xL, yA - half, { color: t.accent2, width: 2.4, head: hd }); SK.arrow(ctx, xL, yA + half - hd - 2, xL, yA + half, { color: t.accent2, width: 2.4, head: hd }); }
      else { SK.arrow(ctx, xL, yA - half, xL, yA - half + hd + 2, { color: t.accent2, width: 2.4, head: hd }); SK.arrow(ctx, xL, yA + half, xL, yA + half - hd - 2, { color: t.accent2, width: 2.4, head: hd }); }
      ctx.restore();
    }

    function draw(ctx, w, h) {
      const t = SK.theme();
      ctx.clearRect(0, 0, w, h);
      const xL = w * 0.42, yA = h * 0.52, sc = Math.min((w * 0.42 - 30) / A_MAX, (h / 2 - 24) / 8);
      const half = Math.min(yA - 10, 7.5 * sc);
      const f = fSigned();

      // axis
      ctx.save(); ctx.strokeStyle = t.axis; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, yA); ctx.lineTo(w, yA); ctx.stroke(); ctx.restore();
      // foci
      SK.dot(ctx, xL - f * sc, yA, 3, t.muted); SK.dot(ctx, xL + f * sc, yA, 3, t.muted);
      SK.label(ctx, 'F', xL - f * sc, yA + 14, { color: t.muted, align: 'center', font: '11px system-ui' });
      lens(ctx, xL, yA, half, t);
      SK.label(ctx, 'čočka', xL, yA - half - 6, { color: t.accent2, align: 'center', font: '11px system-ui' });

      // object
      const objX = xL - a * sc, objTip = yA - yObj * sc;
      SK.arrow(ctx, objX, yA, objX, objTip, { color: t.pos, width: 3, head: 9 });
      SK.dot(ctx, objX, objTip, 5, t.pos);
      SK.label(ctx, 'objekt', objX, yA + 16, { color: t.pos, align: 'center', font: '11px system-ui' });

      // eye (observer) on far side
      const eyeX = xL + eyeD * sc;
      eye(ctx, eyeX, yA, t, 13);
      SK.label(ctx, 'pozorovatel', eyeX, yA + 26, { color: t.fg, align: 'center', font: '11px system-ui' });

      const im = image();
      let perceivedZ = 1, upright = true, real = false, infinity = im.inf;
      if (!im.inf) {
        const imgX = xL + im.aP * sc, imgTip = yA - im.Z * yObj * sc;
        real = im.aP > 0; upright = im.Z > 0; perceivedZ = im.Z;
        // perceived image arrow (real solid / virtual dashed)
        SK.arrow(ctx, imgX, yA, imgX, imgTip, { color: t.accent, width: 3, head: 9, dash: real ? null : [6, 4] });
        SK.dot(ctx, imgX, imgTip, 4.5, t.accent);
        SK.label(ctx, real ? 'obraz (skutečný)' : 'obraz (zdánlivý)', imgX, imgTip + (im.Z * yObj < 0 ? 16 : -10), { color: t.accent, align: 'center', font: '11px system-ui' });
        // chief ray: object tip → lens centre → eye, and to image tip
        ctx.save(); ctx.strokeStyle = t.mag; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(objX, objTip); ctx.lineTo(xL, yA); ctx.lineTo(eyeX, yA + (yA - objTip) * 0); ctx.stroke();
        // line of sight from eye toward where image appears (dashed if virtual)
        ctx.setLineDash(real ? [] : [5, 4]); ctx.strokeStyle = t.accent;
        ctx.beginPath(); ctx.moveTo(eyeX, yA); ctx.lineTo(imgX, imgTip); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      } else {
        SK.label(ctx, 'obraz v nekonečnu', xL + 30, yA - 30, { color: t.warn, font: '12px system-ui' });
      }

      // ── inset: "co vidí pozorovatel" ──
      const bx = w - 150, by = 14, bw = 134, bh = 130;
      ctx.save(); ctx.fillStyle = t.bg; ctx.globalAlpha = 0.9; ctx.fillRect(bx, by, bw, bh); ctx.globalAlpha = 1;
      ctx.strokeStyle = t.accent; ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, bw, bh); ctx.restore();
      SK.label(ctx, 'Co vidí pozorovatel', bx + bw / 2, by + 14, { color: t.fg, align: 'center', font: 'bold 11px system-ui' });
      const cyMid = by + bh / 2 + 8;
      // reference (object) faint
      ctx.save(); ctx.globalAlpha = 0.35; SK.arrow(ctx, bx + 30, cyMid, bx + 30, cyMid - 24, { color: t.pos, width: 2, head: 6 }); ctx.restore();
      SK.label(ctx, 'objekt', bx + 30, cyMid + 14, { color: t.muted, align: 'center', font: '9px system-ui' });
      if (!infinity) {
        const mag = SK.clamp(Math.abs(perceivedZ), 0.1, 3.0);
        const ax = bx + 96, len = 24 * mag;
        SK.arrow(ctx, ax, cyMid, ax, cyMid - (upright ? len : -len), { color: t.accent, width: 3, head: 7 });
        SK.label(ctx, (upright ? 'přímý' : 'převrácený'), bx + bw / 2, by + bh - 8, { color: t.accent, align: 'center', font: '10px system-ui' });
      } else {
        SK.label(ctx, '— rozostřeno —', bx + bw / 2, cyMid, { color: t.warn, align: 'center', font: '10px system-ui' });
      }

      // readout
      if (infinity) {
        ro.innerHTML = `<b>${kind}</b> · f=${SK.fmt(f, 0)} cm · a=${SK.fmt(a, 1)} cm<br>Objekt v ohnisku → obraz v nekonečnu (paprsky vystupují rovnoběžně).`;
      } else {
        const sizeTxt = Math.abs(perceivedZ) > 1.02 ? 'zvětšený' : Math.abs(perceivedZ) < 0.98 ? 'zmenšený' : 'stejně velký';
        ro.innerHTML = `<b>${kind}</b> · f=${SK.fmt(f, 0)} cm · a=${SK.fmt(a, 1)} cm · a′=${SK.fmt(im.aP, 1)} cm<br>` +
          `Z = ${SK.fmt(perceivedZ, 2)} → pozorovatel vidí <b>${real ? 'skutečný' : 'zdánlivý'}, ${upright ? 'přímý' : 'převrácený'}, ${sizeTxt}</b> obraz.<br>` +
          (kind === 'spojka' && a < fAbs ? 'Objekt uvnitř ohniska → lupa: zvětšený přímý zdánlivý obraz.' :
           kind === 'spojka' ? 'Objekt vně ohniska → převrácený skutečný obraz (jako u promítání).' :
           'Rozptylka → vždy zmenšený přímý zdánlivý obraz.') +
          '<br>Táhni objekt nebo oko.';
      }
    }

    // drag object (left of lens) or eye (right of lens)
    canvas.addEventListener('pointerdown', (e) => {
      const { w, h } = view.dims(); const p = SK.pointer(canvas, e);
      dragging = p.x < w * 0.42 - 6 ? 'obj' : 'eye'; canvas.setPointerCapture(e.pointerId); move(p, w, h);
    });
    canvas.addEventListener('pointermove', (e) => { if (dragging) { const { w, h } = view.dims(); move(SK.pointer(canvas, e), w, h); } });
    canvas.addEventListener('pointerup', () => dragging = null);
    canvas.addEventListener('pointercancel', () => dragging = null);
    function move(p, w, h) {
      const xL = w * 0.42, yA = h * 0.52, sc = Math.min((w * 0.42 - 30) / A_MAX, (h / 2 - 24) / 8);
      if (dragging === 'obj') { a = SK.clamp((xL - p.x) / sc, A_MIN, A_MAX); yObj = SK.clamp((yA - p.y) / sc, 1, 7.5); sA.set(a); sY.set(yObj); }
      else { eyeD = SK.clamp((p.x - xL) / sc, 4, A_MAX); }
      view.redraw();
    }

    const ctrl = document.getElementById('ctrl');
    ctrl.appendChild(SK.tabs({ options: [{ label: 'Spojka', value: 'spojka' }, { label: 'Rozptylka', value: 'rozptylka' }], value: 'spojka', onchange: (v) => { kind = v; view.redraw(); } }).el);
    const sA = SK.slider({ label: 'Vzdálenost objektu a', min: A_MIN, max: A_MAX, step: 0.5, value: 7, unit: 'cm', fmt: (v) => SK.fmt(v, 1), oninput: (v) => { a = v; view.redraw(); } });
    const sY = SK.slider({ label: 'Výška objektu', min: 1, max: 7.5, step: 0.5, value: 3, unit: 'cm', fmt: (v) => SK.fmt(v, 1), oninput: (v) => { yObj = v; view.redraw(); } });
    SK.controls(ctrl, [
      SK.slider({ label: 'Ohnisko |f|', min: 3, max: 24, step: 1, value: 12, unit: 'cm', fmt: (v) => v | 0, oninput: (v) => { fAbs = v; view.redraw(); } }),
      sA, sY,
    ]);
    const hint = document.createElement('div'); hint.className = 'sk-hint';
    hint.textContent = 'Pozorovatel se dívá skrz čočku na objekt. Vpravo nahoře panel „Co vidí pozorovatel" ukazuje obraz tak, ' +
      'jak ho oko vnímá — jeho velikost (|Z|) a orientaci. Spojka s objektem uvnitř ohniska = lupa (zvětšený přímý ' +
      'zdánlivý obraz); vně ohniska dává převrácený skutečný obraz. Rozptylka vždy zmenšený přímý zdánlivý. ' +
      'Zdánlivý obraz je naznačen čárkovaně (paprsky se za čočkou jen zdánlivě rozbíhají z jeho polohy). Táhni objekt i oko.';
    ctrl.appendChild(hint);
  })();</script>
</body>
</html>
